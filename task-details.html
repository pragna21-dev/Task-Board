<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Task Details</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  </head>

  <body class="p-4">
    <main class="max-w-2xl mx-auto">
      <a href="index.html" class="inline-flex items-center gap-2 text-indigo-600 hover:text-indigo-800 mb-6">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Tasks
      </a>

      <section class="bg-white rounded-xl border border-gray-200 shadow-md p-6">
        <div class="flex justify-between items-center gap-3 mb-5">
          <h1 class="text-2xl font-bold">Task Details</h1>

          <span class="bg-red-100 text-red-700 text-sm px-3 py-1 rounded-full"> High </span>
        </div>

        <hr class="mb-5 border-gray-200" />

        <h2 class="text-xl text-gray-800 mb-5">Complete HTML structure</h2>

        <p class="text-sm text-gray-500 mb-1">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation</p>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-gray-50 p-4 rounded-lg">
            <p class="text-sm text-gray-500 mb-2">Status</p>
            <span class="text-yellow-700"> Pending </span>
          </div>

          <div class="bg-gray-50 p-4 rounded-lg">
            <p class="text-sm text-gray-500 mb-2">Due Date</p>
            <p class="text-gray-800">30 Oct 2026</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
